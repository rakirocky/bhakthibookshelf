<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:radial-gradient(ellipse 60% 80% at 33% 50%,#2a3560 0%,#1b2347 45%,#141a38 100%);font-family:'Playfair Display',serif;position:relative}
.frame{position:absolute;inset:20px;border:1px solid rgba(212,160,40,.55)}
.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#d9a02a}
.d1{left:32px;top:32px}.d2{right:32px;top:32px}.d3{left:32px;bottom:32px}.d4{right:32px;bottom:32px}
.logo{position:absolute;left:190px;top:100px;width:300px;height:300px;border-radius:50%;
 background:linear-gradient(145deg,#f6d27a,#c9861c 55%,#f0c25a);padding:8px;box-sizing:border-box;
 box-shadow:0 0 40px rgba(240,170,50,.35),0 18px 40px rgba(0,0,0,.5)}
.logo img{width:100%;height:100%;border-radius:50%;display:block}
.txt{position:absolute;left:540px;top:150px}
h1{margin:0;font-size:66px;line-height:1.0;color:#fff;font-weight:700}
h1 span{display:block;background:linear-gradient(180deg,#f7c84a,#e0901c);-webkit-background-clip:text;color:transparent}
p{margin:22px 0 0;font-style:italic;font-size:24px;color:#e9e3d2}
.rule{margin-top:20px;width:220px;height:2px;background:linear-gradient(90deg,#d9a02a,transparent)}
</style></head><body>
<div class="frame"></div><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="dot d4"></div>
<div class="logo"><img src="../../public/images/logo-v4.png"></div>
<div class="txt"><h1>Bhakthi<span>Bookshelf</span></h1><p>A Home for Devotional Reading</p><div class="rule"></div></div>
</body></html>
