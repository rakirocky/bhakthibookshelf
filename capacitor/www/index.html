<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bhakthi Bookshelf</title>
<style>
  html,body{margin:0;height:100%;background:#fff7ec;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#7a4a1d}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px}
  .dot{width:36px;height:36px;border-radius:50%;border:3px solid #e0b483;border-top-color:#a5642a;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="dot"></div>
  <div>Loading Bhakthi Bookshelf…</div>
</div>
</body>
</html>
